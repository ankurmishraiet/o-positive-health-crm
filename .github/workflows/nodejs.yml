name: Node.js CI/CD

on:
  push:
    branches: [ "main" ]

jobs:
  build:

    runs-on: self-hosted

    defaults:
       run:
         working-directory: server

    strategy:
      matrix:
        node-version: [20.x]

    steps:
    - uses: actions/checkout@v4

    - name: Change Directory to server
      working-directory: server
      run: echo "Changed to server directory"

    - name: Check Node.js Version
      uses: actions/setup-node@v4
      with:
        node-version: ${{ matrix.node-version }}
        cache: 'npm'
        cache-dependency-path: './server/package-lock.json'

    - name: Install Dependencies
      working-directory: server
      run: npm ci

    - name: Install PM2 Globally
      run: npm i -g pm2

    - name: Restart or Start Application with PM2
      run: |
            if pm2 list | grep -q OPHAPIs; then
              pm2 restart OPHAPIs
            else
              pm2 start "npm run start" --name OPHAPIs
            fi
